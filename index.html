<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캠퍼스 날씨 체커 (Campus Weather)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter & Pretendard vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f3f4f6;
        }
        .weather-card-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15), 0 8px 10px -6px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Mobile Container Wrapper for Desktop Viewport simulation & mobile responsiveness -->
    <div class="w-full max-w-md bg-white sm:rounded-3xl shadow-2xl overflow-hidden min-h-screen sm:min-h-[800px] flex flex-col justify-between">
        
        <!-- Header Section -->
        <header class="bg-white px-6 pt-6 pb-4 border-b border-slate-100 sticky top-0 z-10">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">Campus Live</span>
                    <h1 class="text-2xl font-bold text-slate-800 mt-1">캠퍼스 날씨 체커</h1>
                </div>
                <div class="text-right">
                    <div id="current-time" class="text-sm font-medium text-slate-500">불러오는 중...</div>
                    <div class="text-xs text-slate-400">학위 취득의 성지, 캠퍼스</div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-6 flex-1 flex flex-col gap-6">
            
            <!-- Campus Location Selector Tabs -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">캠퍼스 거점 선택</label>
                <div class="grid grid-cols-3 gap-2 bg-slate-100 p-1 rounded-2xl">
                    <button onclick="switchLocation('gate')" id="btn-gate" class="py-2.5 px-3 text-xs sm:text-sm font-medium rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm flex flex-col items-center gap-1">
                        <i class="fa-solid fa-person-walking-arrow-right"></i>
                        <span>정문/언덕길</span>
                    </button>
                    <button onclick="switchLocation('library')" id="btn-library" class="py-2.5 px-3 text-xs sm:text-sm font-medium rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900 flex flex-col items-center gap-1">
                        <i class="fa-solid fa-book-open"></i>
                        <span>중앙도서관</span>
                    </button>
                    <button onclick="switchLocation('hall')" id="btn-hall" class="py-2.5 px-3 text-xs sm:text-sm font-medium rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900 flex flex-col items-center gap-1">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <span>인문/공학동</span>
                    </button>
                </div>
            </div>

            <!-- Weather Summary Card -->
            <div class="weather-card-gradient text-white rounded-3xl p-6 card-shadow relative overflow-hidden transition-all duration-300">
                <!-- Decorative background elements -->
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                
                <div class="flex justify-between items-start">
                    <div>
                        <span id="location-name" class="text-blue-100 text-sm font-medium">정문 및 언덕길 (지형성 바람 주의)</span>
                        <div class="flex items-baseline gap-2 mt-2">
                            <span id="temp-display" class="text-5xl font-extrabold tracking-tight">14°C</span>
                            <span id="weather-desc" class="text-lg font-medium text-blue-100">구름 많음</span>
                        </div>
                    </div>
                    <div id="weather-icon-container" class="text-5xl text-blue-100 animate-pulse">
                        <i class="fa-solid fa-cloud-sun"></i>
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-white/20 flex items-center justify-between text-xs sm:text-sm text-blue-100">
                    <div class="flex items-center gap-1.5">
                        <i class="fa-solid fa-temperature-arrow-down"></i>
                        <span>체감 <strong id="feels-like" class="text-white">12°C</strong></span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i class="fa-solid fa-droplet"></i>
                        <span>습도 <strong id="humidity" class="text-white">55%</strong></span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i class="fa-solid fa-wind"></i>
                        <span>풍속 <strong id="wind-speed" class="text-white">4.2 m/s</strong></span>
                    </div>
                </div>
            </div>

            <!-- Comment / Alert Banner -->
            <div id="weather-comment-box" class="bg-amber-50 border border-amber-200/80 rounded-2xl p-4 flex items-start gap-3 transition-all duration-300">
                <div class="text-amber-500 text-lg mt-0.5">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                    <h3 id="comment-title" class="text-sm font-bold text-amber-900">등굣길 바람 주의보</h3>
                    <p id="comment-desc" class="text-xs text-amber-700 mt-0.5">언덕길 구간에서 맞바람이 강하게 불어요. 가벼운 바람막이나 얇은 아우터를 추천합니다.</p>
                </div>
            </div>

            <!-- Commuter/Student Guide (Checklist) -->
            <div>
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">통학러 맞춤 등교 준비물 가이드</h2>
                <div class="grid grid-cols-3 gap-3">
                    
                    <!-- Umbrella Guide -->
                    <div class="bg-slate-50 border border-slate-200/60 rounded-2xl p-3.5 flex flex-col items-center text-center">
                        <div id="guide-umbrella-icon" class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg mb-2">
                            <i class="fa-solid fa-umbrella"></i>
                        </div>
                        <span class="text-xs text-slate-400 font-medium">우산 여부</span>
                        <span id="guide-umbrella-text" class="text-sm font-bold text-slate-800 mt-0.5">지참 불필요</span>
                    </div>

                    <!-- Outerwear Guide -->
                    <div class="bg-slate-50 border border-slate-200/60 rounded-2xl p-3.5 flex flex-col items-center text-center">
                        <div id="guide-outer-icon" class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg mb-2">
                            <i class="fa-solid fa-shirt"></i>
                        </div>
                        <span class="text-xs text-slate-400 font-medium">추천 아우터</span>
                        <span id="guide-outer-text" class="text-sm font-bold text-slate-800 mt-0.5">가디건/자켓</span>
                    </div>

                    <!-- Campus Wind / Move Index -->
                    <div class="bg-slate-50 border border-slate-200/60 rounded-2xl p-3.5 flex flex-col items-center text-center">
                        <div id="guide-wind-icon" class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg mb-2">
                            <i class="fa-solid fa-person-hiking"></i>
                        </div>
                        <span class="text-xs text-slate-400 font-medium">언덕 이동지수</span>
                        <span id="guide-wind-text" class="text-sm font-bold text-slate-800 mt-0.5">보통 (쾌적)</span>
                    </div>

                </div>
            </div>

        </main>

        <!-- Footer / Simulated Refresh Action -->
        <footer class="bg-slate-50 px-6 py-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
            <span>© 2026 Campus Weather Project</span>
            <button onclick="refreshWeatherData()" class="text-blue-600 font-semibold hover:underline flex items-center gap-1">
                <i class="fa-solid fa-rotate-right" id="refresh-icon"></i> 실시간 갱신
            </button>
        </footer>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Mock Weather Database for Campus Locations
        const campusData = {
            gate: {
                name: "정문 및 언덕길 (지형성 바람 구역)",
                temp: "13°C",
                feelsLike: "10°C",
                humidity: "60%",
                windSpeed: "6.5 m/s",
                desc: "흐림 후 바람",
                iconClass: "fa-solid fa-wind",
                commentTitle: "정문 언덕길 맞바람 주의",
                commentDesc: "지하철역에서 올라오는 언덕 구간에 돌풍이 불 수 있습니다. 체감온도가 낮으니 따뜻한 겉옷을 여미세요.",
                commentType: "warning", // warning, info, success
                umbrella: "우산 지참",
                umbrellaSub: "오후 3시 비 소식",
                outer: "바람막이/자켓",
                windIndex: "주의 (바람 강함)"
            },
            library: {
                name: "중앙도서관 광장 (개방형 공간)",
                temp: "15°C",
                feelsLike: "14°C",
                humidity: "52%",
                windSpeed: "3.1 m/s",
                desc: "구름 조금",
                iconClass: "fa-solid fa-cloud-sun",
                commentTitle: "독서하기 쾌적한 날씨",
                commentDesc: "도서관 주변 광장 햇살이 좋습니다. 실내는 에어컨 가동 중이니 얇은 셔츠나 가디건을 챙기세요.",
                commentType: "success",
                umbrella: "지참 불필요",
                umbrellaSub: "강수 확률 10%",
                outer: "가디건/셔츠",
                windIndex: "좋음 (산책 최적)"
            },
            hall: {
                name: "인문관 및 공학강의동 밀집 지역",
                temp: "14.5°C",
                feelsLike: "13.5°C",
                humidity: "55%",
                windSpeed: "2.4 m/s",
                desc: "맑음",
                iconClass: "fa-solid fa-sun",
                commentTitle: "강의실 이동 최적",
                commentDesc: "건물 사이 그늘이 시원합니다. 건물 간 이동 시 별다른 기상 제약 없이 원활하게 통행 가능합니다.",
                commentType: "info",
                umbrella: "지참 불필요",
                umbrellaSub: "맑고 깨끗함",
                outer: "기본 캐주얼",
                windIndex: "매우 좋음"
            }
        };

        // Current active location tracker
        let currentLocation = 'gate';

        // Update real time clock
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').innerText = `${hours}:${minutes}:${seconds} 실시간`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Switch location tab function
        function switchLocation(locationKey) {
            currentLocation = locationKey;
            
            // Reset button states
            ['gate', 'library', 'hall'].forEach(key => {
                const btn = document.getElementById(`btn-${key}`);
                if (key === locationKey) {
                    btn.className = "py-2.5 px-3 text-xs sm:text-sm font-medium rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm flex flex-col items-center gap-1";
                } else {
                    btn.className = "py-2.5 px-3 text-xs sm:text-sm font-medium rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900 flex flex-col items-center gap-1";
                }
            });

            // Populate data
            const data = campusData[locationKey];
            document.getElementById('location-name').innerText = data.name;
            document.getElementById('temp-display').innerText = data.temp;
            document.getElementById('weather-desc').innerText = data.desc;
            document.getElementById('feels-like').innerText = data.feelsLike;
            document.getElementById('humidity').innerText = data.humidity;
            document.getElementById('wind-speed').innerText = data.windSpeed;
            
            // Icon update
            document.getElementById('weather-icon-container').innerHTML = `<i class="${data.iconClass}"></i>`;

            // Comment box update
            const commentBox = document.getElementById('weather-comment-box');
            document.getElementById('comment-title').innerText = data.commentTitle;
            document.getElementById('comment-desc').innerText = data.commentDesc;

            if (data.commentType === 'warning') {
                commentBox.className = "bg-amber-50 border border-amber-200/80 rounded-2xl p-4 flex items-start gap-3 transition-all duration-300";
                commentBox.querySelector('div').className = "text-amber-500 text-lg mt-0.5";
                commentBox.querySelector('div').innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
                document.getElementById('comment-title').className = "text-sm font-bold text-amber-900";
                document.getElementById('comment-desc').className = "text-xs text-amber-700 mt-0.5";
            } else if (data.commentType === 'success') {
                commentBox.className = "bg-emerald-50 border border-emerald-200/80 rounded-2xl p-4 flex items-start gap-3 transition-all duration-300";
                commentBox.querySelector('div').className = "text-emerald-500 text-lg mt-0.5";
                commentBox.querySelector('div').innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                document.getElementById('comment-title').className = "text-sm font-bold text-emerald-900";
                document.getElementById('comment-desc').className = "text-xs text-emerald-700 mt-0.5";
            } else {
                commentBox.className = "bg-blue-50 border border-blue-200/80 rounded-2xl p-4 flex items-start gap-3 transition-all duration-300";
                commentBox.querySelector('div').className = "text-blue-500 text-lg mt-0.5";
                commentBox.querySelector('div').innerHTML = '<i class="fa-solid fa-circle-info"></i>';
                document.getElementById('comment-title').className = "text-sm font-bold text-blue-900";
                document.getElementById('comment-desc').className = "text-xs text-blue-700 mt-0.5";
            }

            // Guide cards update
            document.getElementById('guide-umbrella-text').innerText = data.umbrella;
            document.getElementById('guide-outer-text').innerText = data.outer;
            document.getElementById('guide-wind-text').innerText = data.windIndex;
        }

        // Simulated refresh animation
        function refreshWeatherData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('fa-spin');
            setTimeout(() => {
                icon.classList.remove('fa-spin');
                switchLocation(currentLocation);
            }, 600);
        }
    </script>
</body>
</html>
